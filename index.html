<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月極駐車場</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>　
  <h1>月極駐車場</h1>
  <h3>新天町公民館前</h3>
</header>

<section>
  <h2>1️⃣&nbsp;利用状況</h2>
  <div id="parking-status">
    読み込み中...
  </div>
</section>

<section>
  <h2>2️⃣&nbsp;料　金</h2>

  <table>
    <tr>
      <th>支払い方法</th>
      <th>料　金</th>
    </tr>
    <tr>
      <td>口座振込</td>
      <td>4,300&nbsp;円／月</td>
    </tr>
    <tr>
      <td>現金払い</td>
      <td>4,500&nbsp;円／月</td>
    </tr>
  </table>
  ※初月無料、以後、当月分を１０日までにお支払いください。
</section>

<section>
  <h2>3️⃣&nbsp;主要な留意点</h2>
  <ul>
    <li>車輌の盗難・損害は責任を負いません</li>
    <li>騒音、振動、悪臭等の迷惑行為を禁止します</li>
    <li>契約区画以外への駐車を禁止します</li>
  </ul>
  ※詳細については、契約書に明記しています
</section>

<section>
  <h2>4️⃣&nbsp;利用申込</h2>

  <form id="applyForm">

    <label>氏　名</label>
    <input type="text" name="name" required>

    <label>メールアドレス</label>
    <input type="email" name="email" required>

    <label>希望駐車場</label>
    <select
      id="request"
      name="request"
      required>
  
      <option value="">
        読み込み中...
      </option>  
    </select>
    
    <label>連絡欄</label>
    <textarea name="message"></textarea>

    <button 
      type="submit" 
      id="submitButton">
      申し込む
    </button>

  </form>

  <div id="result"></div>

</section>

<footer>
  <p>＠新天町公民館前&nbsp;月極駐車場</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
